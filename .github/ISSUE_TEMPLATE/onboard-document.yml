# GENERATED by tooling/gen_issue_forms.py -- edit that script (or
# tooling/languages.json / registry.yaml) instead, then run it.
name: Onboard a new document
description: "Translations managers only: submit a finished English document to be translated."
title: "Onboard: "
labels: ["onboarding"]
body:
  - type: markdown
    attributes:
      value: |
        For a **new document** only. To add languages to a document that's already here, use the
        **Add languages to a document** form (or **+ Add languages** on the
        [Status page](https://genai-security-project.github.io/translations/status.html)).

        Only **translations managers** can use this (the `translations-managers` team, Maintain on
        this repo, or an org owner); anyone else's request is declined with a comment. The result is
        an onboarding pull request, linked here in a comment; merging it starts a machine-drafted
        translation of each language automatically.
  - type: textarea
    id: source_file
    attributes:
      label: Source file
      description: "Drag the finished English **.pdf** or **.docx** into this box (one file). Its file name becomes the document id, so name it well, e.g. `OWASP-Top-10-for-LLM-Applications-2026.pdf`."
      placeholder: Drop the .pdf or .docx here
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "2026.12.6"
    validations:
      required: true
  - type: dropdown
    id: locales
    attributes:
      label: Languages to translate into
      description: Choose one or more.
      multiple: true
      options:
        - "Arabic — العربية [ar-SA]"
        - "Bengali — বাংলা [bn-BD]"
        - "Bulgarian — Български [bg-BG]"
        - "Catalan — Català [ca-ES]"
        - "Chinese (Simplified) — 简体中文 [zh-CN]"
        - "Chinese (Traditional) — 繁體中文 [zh-TW]"
        - "Croatian — Hrvatski [hr-HR]"
        - "Czech — Čeština [cs-CZ]"
        - "Danish — Dansk [da-DK]"
        - "Dutch — Nederlands [nl-NL]"
        - "Estonian — Eesti [et-EE]"
        - "Filipino — Filipino [fil-PH]"
        - "Finnish — Suomi [fi-FI]"
        - "French — Français [fr-FR]"
        - "German — Deutsch [de-DE]"
        - "Greek — Ελληνικά [el-GR]"
        - "Hebrew — עברית [he-IL]"
        - "Hindi — हिन्दी [hi-IN]"
        - "Hungarian — Magyar [hu-HU]"
        - "Indonesian — Bahasa Indonesia [id-ID]"
        - "Italian — Italiano [it-IT]"
        - "Japanese — 日本語 [ja-JP]"
        - "Korean — 한국어 [ko-KR]"
        - "Latvian — Latviešu [lv-LV]"
        - "Lithuanian — Lietuvių [lt-LT]"
        - "Malay — Bahasa Melayu [ms-MY]"
        - "Norwegian — Norsk bokmål [nb-NO]"
        - "Persian — فارسی [fa-IR]"
        - "Polish — Polski [pl-PL]"
        - "Portuguese (Brazil) — Português (Brasil) [pt-BR]"
        - "Portuguese (Portugal) — Português (Portugal) [pt-PT]"
        - "Romanian — Română [ro-RO]"
        - "Russian — Русский [ru-RU]"
        - "Serbian — Српски [sr-RS]"
        - "Slovak — Slovenčina [sk-SK]"
        - "Slovenian — Slovenščina [sl-SI]"
        - "Spanish (Latin America) — Español (Latinoamérica) [es-419]"
        - "Spanish (Spain) — Español (España) [es-ES]"
        - "Swahili — Kiswahili [sw-KE]"
        - "Swedish — Svenska [sv-SE]"
        - "Tamil — தமிழ் [ta-IN]"
        - "Thai — ไทย [th-TH]"
        - "Turkish — Türkçe [tr-TR]"
        - "Ukrainian — Українська [uk-UA]"
        - "Urdu — اردو [ur-PK]"
        - "Vietnamese — Tiếng Việt [vi-VN]"
    validations:
      required: true
  - type: input
    id: other_locales
    attributes:
      label: Other language codes (optional)
      description: Only for languages missing from the list above. Comma-separated BCP-47 codes.
      placeholder: "mn-MN"
  - type: dropdown
    id: template
    attributes:
      label: Layout template
      options:
        - "green-template"
        - "blue-template"
        - "yellow-template"
      default: 0
    validations:
      required: true
  - type: input
    id: source_repo
    attributes:
      label: English source repository (optional)
      placeholder: "GenAI-Security-Project/Agentic-Top-10"
  - type: input
    id: source_path
    attributes:
      label: Path in that repository (optional)
      placeholder: "_source/"
  - type: input
    id: owners
    attributes:
      label: Document owners (optional)
      description: Comma-separated GitHub usernames. Defaults to you.
  - type: checkboxes
    id: public_ack
    attributes:
      label: Public file
      options:
        - label: I understand that this repository is public, so the attached file can be downloaded by anyone.
          required: true
