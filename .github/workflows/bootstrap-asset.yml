name: bootstrap-asset

# Component 1. Fires when a finished English asset (new, or a new version /
# new locales of an existing one) is submitted. Today: manually via
# workflow_dispatch, since component 6 (the GitHub Pages upload form) hasn't
# been built yet — see tooling/README.md. Once that form exists it will
# commit the raw uploaded file under _incoming/ and fire this via
# repository_dispatch instead; nothing else about this workflow changes.
#
# Never creates a registry entry or folder tree directly on a protected
# branch — always via PR, for CODEOWNERS review.

on:
  workflow_dispatch:
    inputs:
      asset:
        description: "Required to add a locale/version to an EXISTING asset. Leave blank for a brand-new asset to derive an id from uploaded_path's filename."
        required: false
      version:
        required: true
      locales:
        description: "Comma-separated BCP-47 codes, e.g. de-DE,es-ES"
        required: true
      source_repo:
        description: "owner/repo of the English source (new assets only)"
        required: false
      source_path:
        required: false
      split_by:
        type: choice
        options: [existing_files, heading_1, pdf_heading]
        required: false
      template:
        type: choice
        options: [blue-template, green-template, yellow-template]
        required: false
      owners:
        description: "Comma-separated GitHub usernames (new assets only)"
        required: false
      uploaded_path:
        description: "Path (within this checkout) to the uploaded file/folder, e.g. _incoming/llm-top-10/source.docx"
        required: false
  repository_dispatch:
    types: [bootstrap-asset]

permissions:
  contents: write
  pull-requests: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling dependencies
        run: pip install -r tooling/requirements.txt

      - name: Run bootstrap_asset.py
        id: bootstrap
        env:
          INPUTS: ${{ toJson(github.event.inputs || github.event.client_payload) }}
        run: |
          python - <<'PY' | tee /tmp/bootstrap_output.txt
          import json, os, subprocess

          i = json.loads(os.environ["INPUTS"])
          cmd = ["python", "tooling/bootstrap_asset.py", "--version", i["version"], "--locales", i["locales"]]
          for flag, key in [
              ("--asset", "asset"),
              ("--source-repo", "source_repo"),
              ("--source-path", "source_path"),
              ("--split-by", "split_by"),
              ("--template", "template"),
              ("--owners", "owners"),
              ("--uploaded-path", "uploaded_path"),
          ]:
              if i.get(key):
                  cmd += [flag, i[key]]
          subprocess.run(cmd, check=True)
          PY

          # asset may have been derived from the filename rather than given explicitly —
          # bootstrap_asset.py always prints the resolved id as its exact last line. Only
          # this one key=value pair goes to GITHUB_OUTPUT; everything else above is just
          # normal job-log output (via tee), not parsed by anything.
          ASSET_ID=$(grep '^asset_id=' /tmp/bootstrap_output.txt | tail -1 | cut -d= -f2-)
          if [ -z "$ASSET_ID" ]; then
            echo "::error::bootstrap_asset.py did not report its resolved asset_id" && exit 1
          fi
          echo "asset=$ASSET_ID" >> "$GITHUB_OUTPUT"

      - name: Open onboarding PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "bootstrap: ${{ steps.bootstrap.outputs.asset }} @ ${{ github.event.inputs.version || github.event.client_payload.version }}"
          branch: "bootstrap/${{ steps.bootstrap.outputs.asset }}-${{ github.run_id }}"
          title: "Onboard ${{ steps.bootstrap.outputs.asset }} @ ${{ github.event.inputs.version || github.event.client_payload.version }}"
          body: |
            Registry entry + scaffolded folder tree, generated by
            `tooling/bootstrap_asset.py` — nothing here was hand-edited.

            Merging this triggers `translate-draft.yml` once per newly added locale.
          labels: bootstrap
