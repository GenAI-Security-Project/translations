name: bootstrap-asset

# Component 1. Fires when a finished English asset (new, or a new version /
# new locales of an existing one) is submitted. Today: manually via
# workflow_dispatch, since component 6 (the GitHub Pages upload form) hasn't
# been built yet — see tooling/README.md. Once that form exists it will
# commit the raw uploaded file under _incoming/ and fire this via
# repository_dispatch instead; nothing else about this workflow changes.
#
# Never creates a registry entry or folder tree directly on a protected
# branch — always via PR, for CODEOWNERS review.

on:
  workflow_dispatch:
    inputs:
      asset:
        description: "Required to add a locale/version to an EXISTING asset. Leave blank for a brand-new asset to derive an id from uploaded_path's filename."
        required: false
      version:
        required: true
      locales:
        description: "Comma-separated BCP-47 codes, e.g. de-DE,es-ES"
        required: true
      source_repo:
        description: "owner/repo of the English source (new assets only)"
        required: false
      source_path:
        required: false
      split_by:
        type: choice
        options: [existing_files, heading_1, pdf_heading]
        required: false
      template:
        type: choice
        options: [blue-template, green-template, yellow-template]
        required: false
      owners:
        description: "Comma-separated GitHub usernames (new assets only)"
        required: false
      uploaded_path:
        description: "Path (within this checkout) to the uploaded file/folder, e.g. _incoming/llm-top-10/source.docx"
        required: false
  repository_dispatch:
    types: [bootstrap-asset]
  # Called by onboard-from-issue.yml (the token-free intake). `payload` is
  # the same JSON shape as client_payload, plus an optional attachment_url
  # (a file dragged into the issue) used instead of uploaded_path.
  workflow_call:
    inputs:
      payload:
        type: string
        required: true
    outputs:
      asset:
        value: ${{ jobs.bootstrap.outputs.asset }}
      pr_url:
        value: ${{ jobs.bootstrap.outputs.pr_url }}

permissions:
  contents: write
  pull-requests: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    outputs:
      asset: ${{ steps.bootstrap.outputs.asset }}
      pr_url: ${{ steps.pr.outputs.pull-request-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling dependencies
        run: pip install -r tooling/requirements.txt

      # Only translations managers (Maintain/Admin on this repo -- the
      # translations-managers team or an org owner) may onboard an asset,
      # whichever way the run was started: the upload page's
      # repository_dispatch (identity = the PAT's owner) or workflow_dispatch
      # from the Actions tab. Replaces the earlier shared TOTP code, which
      # couldn't say *who* submitted. Managed in GitHub, not here.
      - name: Require translations manager
        uses: ./.github/actions/require-manager

      - name: Run bootstrap_asset.py
        id: bootstrap
        env:
          INPUTS: ${{ inputs.payload || toJson(github.event.inputs || github.event.client_payload) }}
        run: |
          python - <<'PY' | tee /tmp/bootstrap_output.txt
          import json, os, subprocess, urllib.request
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          i = json.loads(os.environ["INPUTS"])
          # A file attached to an onboarding issue: download it to a
          # scratch dir (never committed to main -- bootstrap_asset.py copies
          # it into the asset's _source/ in the onboarding PR).
          url = i.get("attachment_url")
          if url:
              u = urlparse(url)
              if u.scheme != "https" or u.hostname != "github.com":
                  raise SystemExit(f"refusing attachment from {u.hostname}")
              dest = Path(os.environ["RUNNER_TEMP"]) / "upload" / unquote(u.path.rsplit("/", 1)[-1])
              dest.parent.mkdir(parents=True, exist_ok=True)
              with urllib.request.urlopen(url, timeout=120) as r, open(dest, "wb") as f:
                  f.write(r.read())
              print(f"downloaded attachment {dest.name} ({dest.stat().st_size} bytes)")
              i["uploaded_path"] = str(dest)
          cmd = ["python", "tooling/bootstrap_asset.py", "--version", i["version"], "--locales", i["locales"]]
          for flag, key in [
              ("--asset", "asset"),
              ("--source-repo", "source_repo"),
              ("--source-path", "source_path"),
              ("--split-by", "split_by"),
              ("--template", "template"),
              ("--owners", "owners"),
              ("--uploaded-path", "uploaded_path"),
          ]:
              if i.get(key):
                  cmd += [flag, i[key]]
          subprocess.run(cmd, check=True)
          PY

          # asset may have been derived from the filename rather than given explicitly —
          # bootstrap_asset.py always prints the resolved id as its exact last line. Only
          # this one key=value pair goes to GITHUB_OUTPUT; everything else above is just
          # normal job-log output (via tee), not parsed by anything.
          ASSET_ID=$(grep '^asset_id=' /tmp/bootstrap_output.txt | tail -1 | cut -d= -f2-)
          if [ -z "$ASSET_ID" ]; then
            echo "::error::bootstrap_asset.py did not report its resolved asset_id" && exit 1
          fi
          echo "asset=$ASSET_ID" >> "$GITHUB_OUTPUT"
          echo "version=$(python -c 'import json,os;print(json.loads(os.environ["INPUTS"])["version"])')" >> "$GITHUB_OUTPUT"

      - name: Open onboarding PR
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "bootstrap: ${{ steps.bootstrap.outputs.asset }} @ ${{ steps.bootstrap.outputs.version }}"
          branch: "bootstrap/${{ steps.bootstrap.outputs.asset }}-${{ github.run_id }}"
          title: "Onboard ${{ steps.bootstrap.outputs.asset }} @ ${{ steps.bootstrap.outputs.version }}"
          body: |
            Registry entry + scaffolded folder tree, generated by
            `tooling/bootstrap_asset.py` — nothing here was hand-edited.

            After merging, draft each newly added locale from Actions →
            translate-draft → Run workflow (one locale per run).
          labels: bootstrap
