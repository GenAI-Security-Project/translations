name: publish

# Component 3 (the publish process, Process 2 -- Assemble & Publish). Never
# runs from the generate process (Process 1) completing on its own (NFR7) --
# only from a human editing the sign-off checklist on the "ready to publish"
# issue check-freshness.yml opened, or a manual workflow_dispatch for
# testing.
#
# Translations managers only (Maintain/Admin on this repo, the same rule as
# every pipeline workflow, .github/actions/require-manager) -- no personal
# access tokens anywhere. A manual run must be started by a manager. On the
# issue path, the edit that completes the sign-off must be made by a
# manager; if anyone else's edit completes it, nothing is published and a
# comment asks a manager to confirm (re-save the issue, or Run workflow).
#
# On a passing sign-off + override-readiness check: pulls the private
# translations-templates repo, renders the final (non-watermarked) PDF (and,
# since render.sh now renders both by default, a DOCX alongside it -- only
# the PDF is committed/released, see tooling/README.md) via render.sh
# --final, commits the PDF to release/, and cuts a GitHub Release.

on:
  issues:
    types: [edited]
  workflow_dispatch:
    inputs:
      asset:
        required: true
      locale:
        required: true
      issue_number:
        description: "Issue number carrying the three-way sign-off checklist"
        required: true

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.issue.labels.*.name, 'ready-to-publish'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve asset/locale/issue from the trigger
        id: resolve
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          IN_ASSET: ${{ inputs.asset }}
          IN_LOCALE: ${{ inputs.locale }}
          IN_ISSUE: ${{ inputs.issue_number }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [[ "$IN_ASSET" =~ ^[a-z0-9][a-z0-9.-]{0,120}$ ]] || { echo "::error::bad asset id: $IN_ASSET"; exit 1; }
            [[ "$IN_LOCALE" =~ ^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$ ]] || { echo "::error::bad locale: $IN_LOCALE"; exit 1; }
            [[ "$IN_ISSUE" =~ ^[0-9]+$ ]] || { echo "::error::bad issue number: $IN_ISSUE"; exit 1; }
            echo "asset=$IN_ASSET" >> "$GITHUB_OUTPUT"
            echo "locale=$IN_LOCALE" >> "$GITHUB_OUTPUT"
            echo "issue_number=$IN_ISSUE" >> "$GITHUB_OUTPUT"
          else
            # Title convention check-freshness.yml writes: "Ready to publish: <asset> / <locale>"
            ASSET=$(echo "$ISSUE_TITLE" | sed -n 's/^Ready to publish: \(.*\) \/ \(.*\)$/\1/p')
            LOCALE=$(echo "$ISSUE_TITLE" | sed -n 's/^Ready to publish: \(.*\) \/ \(.*\)$/\2/p')
            if ! [[ "$ASSET" =~ ^[a-z0-9][a-z0-9.-]{0,120}$ && "$LOCALE" =~ ^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$ ]]; then
              echo "::error::Issue title doesn't match 'Ready to publish: <asset> / <locale>': $ISSUE_TITLE"
              exit 1
            fi
            echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
            echo "locale=$LOCALE" >> "$GITHUB_OUTPUT"
            echo "issue_number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          path: translations

      # Manual runs: the person pressing Run workflow must be a manager.
      - name: Require translations manager
        if: github.event_name == 'workflow_dispatch'
        uses: ./translations/.github/actions/require-manager

      - uses: actions/checkout@v4
        with:
          repository: GenAI-Security-Project/translations-templates
          ssh-key: ${{ secrets.TEMPLATES_DEPLOY_KEY }}
          path: translations-templates

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Ubuntu 24.04 runners restrict unprivileged user namespaces via
      # AppArmor, which Chrome's sandbox needs ("No usable sandbox!").
      # Re-allow them for this job rather than launching Chrome with
      # --no-sandbox.
      - name: Allow Chrome sandbox (Ubuntu 24.04 AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install tooling dependencies
        working-directory: translations
        run: pip install -r tooling/requirements.txt

      - name: Check three-way sign-off
        id: signoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh issue view "${{ steps.resolve.outputs.issue_number }}" --json body --jq .body \
            --repo "${{ github.repository }}" \
            | python3 translations/tooling/check_signoff.py
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "Sign-off incomplete -- nothing to do yet, not a failure."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "0" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      # Issue path: whoever's edit completed the sign-off must be a manager.
      # Anyone else's (e.g. a reviewer ticking the last box) publishes
      # nothing; a manager confirms by re-saving the issue or Run workflow.
      - name: Publishing needs a translations manager
        id: manager
        if: steps.signoff.outputs.proceed == 'true' && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
          ISSUE: ${{ steps.resolve.outputs.issue_number }}
        run: |
          role=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .role_name 2>/dev/null || true)
          if [ "$role" = "admin" ] || [ "$role" = "maintain" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::@$ACTOR (role: ${role:-none}) completed the sign-off but isn't a translations manager; not publishing."
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
              "Sign-off is complete. Publishing must be started by a translations manager: a manager can re-save this issue (edit → Update), or run Actions → **publish** → Run workflow."
          fi

      - name: Override-readiness check (FR5)
        if: steps.signoff.outputs.proceed == 'true' && steps.manager.outputs.allowed != 'false'
        working-directory: translations
        run: |
          python3 tooling/check_render_override.py \
            --asset "${{ steps.resolve.outputs.asset }}" \
            --locale "${{ steps.resolve.outputs.locale }}" \
            --templates-root "$GITHUB_WORKSPACE/translations-templates"

      - name: Render the final PDF
        if: steps.signoff.outputs.proceed == 'true' && steps.manager.outputs.allowed != 'false'
        working-directory: translations
        run: |
          bash tooling/render.sh \
            --asset "${{ steps.resolve.outputs.asset }}" \
            --locale "${{ steps.resolve.outputs.locale }}" \
            --templates-root "$GITHUB_WORKSPACE/translations-templates" \
            --final

      - name: Commit the release PDF
        if: steps.signoff.outputs.proceed == 'true' && steps.manager.outputs.allowed != 'false'
        working-directory: translations
        run: |
          git config user.name "publish[bot]"
          git config user.email "actions@github.com"
          git add "${{ steps.resolve.outputs.asset }}/${{ steps.resolve.outputs.locale }}/release/"
          git commit -m "publish: ${{ steps.resolve.outputs.asset }} / ${{ steps.resolve.outputs.locale }}"
          git push

      - name: Resolve the release filename
        if: steps.signoff.outputs.proceed == 'true' && steps.manager.outputs.allowed != 'false'
        id: release_file
        working-directory: translations
        run: |
          FILE=$(ls "${{ steps.resolve.outputs.asset }}/${{ steps.resolve.outputs.locale }}/release/"*.pdf | tail -1)
          echo "path=$FILE" >> "$GITHUB_OUTPUT"

      - name: Cut a GitHub Release
        if: steps.signoff.outputs.proceed == 'true' && steps.manager.outputs.allowed != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: translations
        run: |
          TAG="${{ steps.resolve.outputs.asset }}-${{ steps.resolve.outputs.locale }}-$(date +%Y%m%d%H%M%S)"
          gh release create "$TAG" "${{ steps.release_file.outputs.path }}" \
            --title "${{ steps.resolve.outputs.asset }} / ${{ steps.resolve.outputs.locale }}" \
            --notes "Published from issue #${{ steps.resolve.outputs.issue_number }} after three-way sign-off."

      - name: Comment and close the issue
        if: steps.signoff.outputs.proceed == 'true' && steps.manager.outputs.allowed != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ steps.resolve.outputs.issue_number }}" \
            --repo "${{ github.repository }}" \
            --body "Published: \`${{ steps.release_file.outputs.path }}\`. See the release for the final PDF."
          gh issue close "${{ steps.resolve.outputs.issue_number }}" --repo "${{ github.repository }}"
