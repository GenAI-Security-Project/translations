name: review-transitions

# Process 1, part B. The only workflow allowed to move status.json sections
# between the human-review states (draft -> in_review -> reviewed). Both
# transitions require an explicit human action in the PR — there is no path
# from draft straight to reviewed without a human either marking the PR
# ready for review or merging it themselves.

on:
  pull_request:
    types: [ready_for_review, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  mark-in-review:
    if: github.event.action == 'ready_for_review' && contains(github.event.pull_request.labels.*.name, 'status:draft')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling dependencies
        run: pip install -r tooling/requirements.txt

      - name: Determine touched asset/locale/sections and transition
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json, os, subprocess

          files = json.loads(subprocess.run(
              ["gh", "pr", "view", os.environ["PR_NUMBER"], "--json", "files", "-q", ".files"],
              capture_output=True, text=True, check=True,
          ).stdout)

          by_asset_locale = {}
          for f in files:
              parts = f["path"].split("/")
              if len(parts) == 3 and parts[2].endswith((".md", ".svg")):
                  asset, locale = parts[0], parts[1]
                  section = parts[2].rsplit(".", 1)[0]
                  by_asset_locale.setdefault((asset, locale), []).append(section)

          for (asset, locale), sections in by_asset_locale.items():
              subprocess.run([
                  "python", "tooling/review_transition.py",
                  "--asset", asset, "--locale", locale,
                  "--sections", ",".join(sections),
                  "--to-status", "in_review",
                  "--pr", os.environ["PR_NUMBER"],
              ], check=True)
          PY

      - name: Commit status.json updates
        run: |
          git config user.name "genai-translations-bot"
          git config user.email "actions@users.noreply.github.com"
          git add '**/status.json'
          git diff --cached --quiet || git commit -m "status: mark sections in_review (PR #${{ github.event.pull_request.number }})"
          git push

      - name: Relabel PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --remove-label status:draft --add-label status:in_review

  mark-reviewed:
    if: >
      github.event.action == 'closed' && github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'status:in_review') ||
       contains(github.event.pull_request.labels.*.name, 'status:draft'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling dependencies
        run: pip install -r tooling/requirements.txt

      - name: Determine touched asset/locale/sections and transition
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWER: ${{ github.event.pull_request.merged_by.login }}
        run: |
          python - <<'PY'
          import json, os, subprocess

          files = json.loads(subprocess.run(
              ["gh", "pr", "view", os.environ["PR_NUMBER"], "--json", "files", "-q", ".files"],
              capture_output=True, text=True, check=True,
          ).stdout)

          by_asset_locale = {}
          for f in files:
              parts = f["path"].split("/")
              if len(parts) == 3 and parts[2].endswith((".md", ".svg")):
                  asset, locale = parts[0], parts[1]
                  section = parts[2].rsplit(".", 1)[0]
                  by_asset_locale.setdefault((asset, locale), []).append(section)

          for (asset, locale), sections in by_asset_locale.items():
              subprocess.run([
                  "python", "tooling/review_transition.py",
                  "--asset", asset, "--locale", locale,
                  "--sections", ",".join(sections),
                  "--to-status", "reviewed",
                  "--reviewer", os.environ["REVIEWER"],
              ], check=True)
          PY

      - name: Commit status.json updates
        run: |
          git config user.name "genai-translations-bot"
          git config user.email "actions@users.noreply.github.com"
          git add '**/status.json'
          git diff --cached --quiet || git commit -m "status: mark sections reviewed (PR #${{ github.event.pull_request.number }})"
          git push

      - name: Relabel PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --remove-label status:draft --remove-label status:in_review --add-label status:reviewed
