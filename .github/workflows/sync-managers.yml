# Publishes the list of translations managers for the site's Managers page
# (docs/managers.html reads docs/data/managers.json).
#
# A manager is anyone with Maintain or Admin on this repo -- the same rule
# .github/actions/require-manager enforces. The collaborator list isn't
# readable by a public page, so this job works it out with the workflow's
# own token and commits the result to main (logins, roles and profile links
# only -- all already public on GitHub). Runs daily and on demand; managers
# are added and removed in GitHub settings, never here.
#
# The workflow token can't see org owners whose org membership is private
# (they're admins through the org, not repo collaborators). So candidates
# are: the repo's collaborators + public org members + everyone already on
# the published list + any logins given in the `add` input -- and each one
# is then checked with the same per-person permission lookup require-manager
# uses. Nobody is listed without Maintain/Admin, and anyone who loses it
# drops off at the next run. Logins in docs/data/managers_exclude.txt are
# never listed (e.g. org owners who don't manage translations).
name: sync-managers

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      add:
        description: "Extra GitHub usernames to check (comma-separated) -- e.g. org owners with private membership. Listed only if they really have Maintain/Admin."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sync-managers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: List managers
        env:
          GH_TOKEN: ${{ github.token }}
          ADD: ${{ inputs.add }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          mkdir -p docs/data
          {
            gh api --paginate "repos/$GITHUB_REPOSITORY/collaborators?affiliation=all&per_page=100" --jq '.[] | select(.type == "User") | .login'
            gh api --paginate "orgs/$ORG/public_members?per_page=100" --jq '.[].login'
            [ -f docs/data/managers.json ] && jq -r '.managers[].login' docs/data/managers.json
            printf '%s\n' "$ADD" | tr ', ' '\n\n'
          } | grep -E '^[A-Za-z0-9](-?[A-Za-z0-9]){0,38}$' | sort -fu > /tmp/all.txt
          # Drop excluded logins (case-insensitive).
          { grep -vE '^\s*(#|$)' docs/data/managers_exclude.txt 2>/dev/null || true; } | tr -d ' \r' > /tmp/exclude.txt
          grep -vixFf /tmp/exclude.txt /tmp/all.txt > /tmp/candidates.txt || true
          echo "checking $(wc -l < /tmp/candidates.txt) candidates"
          : > /tmp/managers.jsonl
          while read -r login; do
            perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$login/permission" 2>/dev/null) || continue
            role=$(jq -r '.role_name' <<<"$perm")
            case "$role" in
              admin|maintain)
                jq -c --arg role "$role" '.user | {login, role: $role, url: .html_url, avatar: .avatar_url}' <<<"$perm" >> /tmp/managers.jsonl ;;
            esac
          done < /tmp/candidates.txt
          jq -s 'sort_by(.role != "maintain", (.login | ascii_downcase))' /tmp/managers.jsonl > /tmp/managers.json
          # Never publish an empty list (e.g. a token that can't check permissions).
          [ "$(jq length /tmp/managers.json)" -gt 0 ] || { echo "::error::no managers found"; exit 1; }
          jq -c '.[] | [.login, .role]' /tmp/managers.json
          jq -n --slurpfile m /tmp/managers.json \
            '{generated_at: (now | todate), source: "Maintain/Admin on this repository", managers: $m[0]}' \
            > docs/data/managers.json.new
          # Only commit when the list itself changed (ignore the timestamp).
          if [ -f docs/data/managers.json ] && \
             [ "$(jq -S .managers docs/data/managers.json)" = "$(jq -S .managers docs/data/managers.json.new)" ]; then
            rm docs/data/managers.json.new; echo "No change."; exit 0
          fi
          mv docs/data/managers.json.new docs/data/managers.json

      - name: Commit if changed
        run: |
          git diff --quiet -- docs/data/managers.json && git ls-files --error-unmatch docs/data/managers.json >/dev/null 2>&1 && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data/managers.json
          git commit -m "sync-managers: update the managers list"
          git pull --rebase --quiet origin main
          git push origin HEAD:main
