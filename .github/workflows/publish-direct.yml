name: publish-direct

# TESTING-ONLY direct publish path. Bypasses the three-way sign-off gate
# that publish.yml enforces (FR4.2) -- gated instead by the
# translations-manager role check (.github/actions/require-manager), the same
# gate every pipeline workflow uses. Exists so the rendering pipeline can be
# validated end-to-end against real content without a live sign-off process
# in place yet. Revisit (fold into publish.yml, or retire) once real sign-off
# practices exist.
#
# Started from Actions -> publish-direct -> Run workflow, under the
# manager's own GitHub sign-in (no personal access token; the old
# repository_dispatch trigger, which needed one, is gone). One run per
# (asset, locale). `watermark` controls render.sh's --final flag: true (the
# default) renders a watermarked preview, always allowed regardless of
# review status; false requests a real final render, which still
# hard-requires every section reviewed -- render.sh's own --final check.

on:
  workflow_dispatch:
    inputs:
      asset:
        description: "Asset id as it appears in registry.yaml"
        required: true
      locale:
        description: "BCP-47 locale code (e.g. ru-RU)"
        required: true
      watermark:
        description: "Watermarked preview (untick for a final render; needs every section reviewed)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out translations
        uses: actions/checkout@v4
        with:
          path: translations

      # Same check as bootstrap-asset.yml: only translations managers may
      # fire this testing-only publish path (it skips the three-way sign-off).
      - name: Require translations manager
        uses: ./translations/.github/actions/require-manager

      - name: Check out translations-templates
        uses: actions/checkout@v4
        with:
          repository: GenAI-Security-Project/translations-templates
          ssh-key: ${{ secrets.TEMPLATES_DEPLOY_KEY }}
          path: translations-templates

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Ubuntu 24.04 runners restrict unprivileged user namespaces via
      # AppArmor, which Chrome's sandbox needs ("No usable sandbox!").
      # Re-allow them for this job rather than launching Chrome with
      # --no-sandbox.
      - name: Allow Chrome sandbox (Ubuntu 24.04 AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install tooling dependencies
        working-directory: translations
        run: pip install -r tooling/requirements.txt

      - name: Resolve inputs
        id: resolve
        env:
          ASSET: ${{ inputs.asset }}
          LOCALE: ${{ inputs.locale }}
          WATERMARK: ${{ inputs.watermark }}
        run: |
          # Validated before they reach any later shell step.
          [[ "$ASSET" =~ ^[a-z0-9][a-z0-9.-]{0,120}$ ]] || { echo "::error::bad asset id: $ASSET"; exit 1; }
          [[ "$LOCALE" =~ ^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$ ]] || { echo "::error::bad locale: $LOCALE"; exit 1; }
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "locale=$LOCALE" >> "$GITHUB_OUTPUT"
          if [ "$WATERMARK" = "false" ]; then
            echo "final_flag=--final" >> "$GITHUB_OUTPUT"
          else
            echo "final_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Override-readiness check (FR5)
        working-directory: translations
        run: |
          python3 tooling/check_render_override.py \
            --asset "${{ steps.resolve.outputs.asset }}" \
            --locale "${{ steps.resolve.outputs.locale }}" \
            --templates-root "$GITHUB_WORKSPACE/translations-templates"

      - name: Render the PDF
        working-directory: translations
        run: |
          bash tooling/render.sh \
            --asset "${{ steps.resolve.outputs.asset }}" \
            --locale "${{ steps.resolve.outputs.locale }}" \
            --templates-root "$GITHUB_WORKSPACE/translations-templates" \
            ${{ steps.resolve.outputs.final_flag }}

      - name: Commit the release PDF
        working-directory: translations
        run: |
          git config user.name "publish-direct[bot]"
          git config user.email "actions@github.com"
          git add "${{ steps.resolve.outputs.asset }}/${{ steps.resolve.outputs.locale }}/release/"
          git commit -m "publish (direct/testing): ${{ steps.resolve.outputs.asset }} / ${{ steps.resolve.outputs.locale }}"
          git push

      - name: Resolve the release filename
        id: release_file
        working-directory: translations
        run: |
          FILE=$(ls -t "${{ steps.resolve.outputs.asset }}/${{ steps.resolve.outputs.locale }}/release/"*.pdf | head -1)
          echo "path=$FILE" >> "$GITHUB_OUTPUT"

      - name: Cut a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: translations
        run: |
          TAG="${{ steps.resolve.outputs.asset }}-${{ steps.resolve.outputs.locale }}-$(date +%Y%m%d%H%M%S)"
          gh release create "$TAG" "${{ steps.release_file.outputs.path }}" \
            --title "${{ steps.resolve.outputs.asset }} / ${{ steps.resolve.outputs.locale }} (direct/testing publish)" \
            --notes "Published via the direct/testing publish path by a translations manager (no sign-off gate)."
