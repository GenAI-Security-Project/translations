name: publish-direct

# TESTING-ONLY preview render: a WATERMARKED PDF of the current
# translation (every section, whatever its review status), for checking
# the rendered layout before sign-off. Managers only (require-manager),
# started from Actions -> publish-direct -> Run workflow.
#
# It never publishes: the PDF is always watermarked DRAFT (render.sh is
# never given --final here), it is NOT committed to the repo, and NO GitHub
# Release is created -- the file is only a workflow artifact, kept 14 days.
# Policy: nothing is published without the three-way sign-off, which only
# publish.yml implements. (Until 2026-11-24 this workflow could also do an
# unwatermarked render and cut a release without sign-off; removed.)

on:
  workflow_dispatch:
    inputs:
      asset:
        description: "Asset id as it appears in registry.yaml"
        required: true
      locale:
        description: "BCP-47 locale code (e.g. ru-RU)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out translations
        uses: actions/checkout@v4
        with:
          path: translations

      # Same check as bootstrap-asset.yml: only translations managers may
      # fire this testing-only publish path (it skips the three-way sign-off).
      - name: Require translations manager
        uses: ./translations/.github/actions/require-manager

      - name: Check out translations-templates
        uses: actions/checkout@v4
        with:
          repository: GenAI-Security-Project/translations-templates
          ssh-key: ${{ secrets.TEMPLATES_DEPLOY_KEY }}
          path: translations-templates

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Ubuntu 24.04 runners restrict unprivileged user namespaces via
      # AppArmor, which Chrome's sandbox needs ("No usable sandbox!").
      # Re-allow them for this job rather than launching Chrome with
      # --no-sandbox.
      - name: Allow Chrome sandbox (Ubuntu 24.04 AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install tooling dependencies
        working-directory: translations
        run: pip install -r tooling/requirements.txt

      - name: Resolve inputs
        id: resolve
        env:
          ASSET: ${{ inputs.asset }}
          LOCALE: ${{ inputs.locale }}
        run: |
          # Validated before they reach any later shell step.
          [[ "$ASSET" =~ ^[a-z0-9][a-z0-9.-]{0,120}$ ]] || { echo "::error::bad asset id: $ASSET"; exit 1; }
          [[ "$LOCALE" =~ ^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$ ]] || { echo "::error::bad locale: $LOCALE"; exit 1; }
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "locale=$LOCALE" >> "$GITHUB_OUTPUT"
          echo "out=$RUNNER_TEMP/preview/$ASSET-$LOCALE-DRAFT-PREVIEW.pdf" >> "$GITHUB_OUTPUT"

      - name: Override-readiness check (FR5)
        working-directory: translations
        run: |
          python3 tooling/check_render_override.py \
            --asset "${{ steps.resolve.outputs.asset }}" \
            --locale "${{ steps.resolve.outputs.locale }}" \
            --templates-root "$GITHUB_WORKSPACE/translations-templates"

      # Never --final: always the watermarked preview.
      - name: Render the watermarked preview PDF
        working-directory: translations
        run: |
          mkdir -p "$(dirname "${{ steps.resolve.outputs.out }}")"
          bash tooling/render.sh \
            --asset "${{ steps.resolve.outputs.asset }}" \
            --locale "${{ steps.resolve.outputs.locale }}" \
            --templates-root "$GITHUB_WORKSPACE/translations-templates" \
            --out "${{ steps.resolve.outputs.out }}" \
            --pdf-only

      - name: Upload the preview (not published)
        uses: actions/upload-artifact@v4
        with:
          name: draft-preview-${{ steps.resolve.outputs.asset }}-${{ steps.resolve.outputs.locale }}
          path: ${{ steps.resolve.outputs.out }}
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        run: |
          echo "Watermarked DRAFT preview of **${{ steps.resolve.outputs.asset }} / ${{ steps.resolve.outputs.locale }}** — download it from this run's Artifacts (14 days). Not published: nothing is committed or released without the three-way sign-off (publish.yml)." >> "$GITHUB_STEP_SUMMARY"
