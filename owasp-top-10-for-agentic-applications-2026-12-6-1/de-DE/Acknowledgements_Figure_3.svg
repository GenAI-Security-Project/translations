  <!-- OCR-extracted text overlay. Verify each line against the original image (see the sibling _original file) before trusting this as a translation source. -->
  <image href="../_source/images/Acknowledgements_Figure_3.png" xlink:href="../_source/images/Acknowledgements_Figure_3.png" width="3542" height="4584"/>
  <text id="t0" x="422" y="885" font-size="106" fill="rgb(0,0,0)" data-ocr-confidence="92">OWASP</text>
  <text id="t1" x="1695" y="922" font-size="160" fill="rgb(0,0,0)" data-ocr-confidence="96">Security Project</text>
  <text id="t2" x="422" y="1122" font-size="146" fill="rgb(0,0,0)" data-ocr-confidence="96">Sponsoren</text>
  <text id="t3" x="419" y="1401" font-size="50" fill="rgb(0,0,0)" data-ocr-confidence="96">Wir schätzen unsere Projektsponsoren, deren finanzielle Beiträge dazu beitragen, die Ziele des</text>
  <text id="t4" x="422" y="1476" font-size="50" fill="rgb(0,0,0)" data-ocr-confidence="95">Projekts zu unterstützen und die operativen Kosten und Outreach-Kosten zu decken, die die von der</text>
  <text id="t5" x="422" y="1548" font-size="50" fill="rgb(0,0,0)" data-ocr-confidence="94">OWASP.org-Stiftung bereitgestellten Ressourcen ergänzen. Das OWASP GenAI Security Project bewahrt weiterhin einen anbieterneutralen und</text>
  <text id="t6" x="422" y="1617" font-size="46" fill="rgb(0,0,0)" data-ocr-confidence="95">unvoreingenommenen Ansatz. Sponsoren erhalten keine besonderen Governance-Vorteile im Rahmen ihrer</text>
  <text id="t7" x="422" y="1690" font-size="42" fill="rgb(0,0,0)" data-ocr-confidence="95">Unterstützung.</text>
  <text id="t8" x="419" y="1837" font-size="47" fill="rgb(0,0,0)" data-ocr-confidence="95">Sponsoren erhalten Anerkennung für ihre Beiträge in unseren Materialien und Web-Auftritten. Alle</text>
  <text id="t9" x="422" y="1912" font-size="50" fill="rgb(0,0,0)" data-ocr-confidence="95">vom Projekt erstellten Materialien werden von der Community entwickelt, vorangetrieben und unter Open-Source- und</text>
  <text id="t10" x="422" y="1972" font-size="37" fill="rgb(0,0,0)" data-ocr-confidence="96">Creative-Commons-Lizenzen veröffentlicht</text>
  <text id="t11" x="1172" y="1981" font-size="46" fill="rgb(0,0,0)" data-ocr-confidence="96">Für weitere Informationen zur Sponsorenschaft besuchen Sie den Sponsoring-</text>
  <text id="t12" x="419" y="2134" font-size="49" fill="rgb(0,0,0)" data-ocr-confidence="95">Bereich auf unserer Website, um mehr darüber zu erfahren, wie Sie das Projekt durch Sponsoring unterstützen können.</text>
