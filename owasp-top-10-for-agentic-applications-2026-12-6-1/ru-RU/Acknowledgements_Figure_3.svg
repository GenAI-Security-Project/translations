  <text id="t16" x="2275" y="2793" font-size="61" fill="rgb(16,16,16)" data-ocr-confidence="78">@ paloalto</text>
  <text id="t17" x="1186" y="2866" font-size="40" fill="rgb(32,72,152)" data-ocr-confidence="87">Mend.io</text>
  <text id="t18" x="1800" y="2896" font-size="78" fill="rgb(0,24,48)" data-ocr-confidence="93">snyk</text>
  <text id="t19" x="2964" y="2862" font-size="33" fill="rgb(32,32,32)" data-ocr-confidence="96">TREND:</text>
  <text id="t20" x="458" y="3016" font-size="26" fill="rgb(136,144,152)" data-ocr-confidence="90">GenAl</text>
  <text id="t21" x="458" y="3051" font-size="16" fill="rgb(80,96,104)" data-ocr-confidence="95">SECURITY</text>
  <text id="t22" x="531" y="3335" font-size="39" fill="rgb(0,0,0)" data-ocr-confidence="82">SPLX</text>
  <text id="t23" x="2267" y="3341" font-size="51" fill="rgb(56,8,88)" data-ocr-confidence="83">&lt;pangea</text>
  <text id="t24" x="2978" y="3357" font-size="77" fill="rgb(0,48,96)" data-ocr-confidence="96">Cobalt</text>
  <text id="t25" x="436" y="3574" font-size="39" fill="rgb(0,0,0)" data-ocr-confidence="80">ca LAKERA</text>
  <text id="t26" x="1617" y="3579" font-size="73" fill="rgb(72,80,184)" data-ocr-confidence="83">a) ActiveFence</text>
  <text id="t27" x="1122" y="3645" font-size="35" fill="rgb(32,32,40)" data-ocr-confidence="88">securiti</text>
