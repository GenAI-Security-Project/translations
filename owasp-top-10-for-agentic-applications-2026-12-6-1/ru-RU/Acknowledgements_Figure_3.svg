  <text id="t29" x="2303" y="3830" font-size="68" fill="rgb(0,0,0)" data-ocr-confidence="72">\ Synack.</text>
  <text id="t30" x="436" y="3860" font-size="45" fill="rgb(48,0,0)" data-ocr-confidence="92">LASSO</text>
  <text id="t31" x="1742" y="3865" font-size="16" fill="rgb(112,112,112)" data-ocr-confidence="90">PROMPTARMOR</text>
  <text id="t32" x="1770" y="4020" font-size="80" fill="rgb(80,104,248)" data-ocr-confidence="67">INA</text>
  <text id="t33" x="431" y="4068" font-size="78" fill="rgb(32,40,64)" data-ocr-confidence="80">&lt;&gt; apiiro</text>
  <text id="t34" x="1217" y="4043" font-size="61" fill="rgb(96,0,232)" data-ocr-confidence="87">akto</text>
  <text id="t35" x="2400" y="4057" font-size="44" fill="rgb(32,32,40)" data-ocr-confidence="90">Starseer</text>
  <text id="t36" x="2947" y="4077" font-size="62" fill="rgb(8,8,8)" data-ocr-confidence="93">Capsule</text>
  <text id="t37" x="1717" y="4089" font-size="35" fill="rgb(32,48,56)" data-ocr-confidence="92">NeuralTrust</text>
  <text id="t38" x="1128" y="4333" font-size="40" fill="rgb(0,0,0)" data-ocr-confidence="93">Список спонсоров по состоянию на дату публикации. Полный список спонсоров можно найти здесь.</text>
  </svg>
