<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3542" height="4584" viewBox="0 0 3542 4584">
  <!-- OCR-extracted text overlay. Verify each line against the original image (see the sibling _original file) before trusting this as a translation source. -->
  <image href="../_source/images/Acknowledgements_Figure_3.png" xlink:href="../_source/images/Acknowledgements_Figure_3.png" width="3542" height="4584"/>
  <text id="t0" x="422" y="885" font-size="106" fill="rgb(0,0,0)" data-ocr-confidence="92">OWASP</text>
  <text id="t1" x="1695" y="922" font-size="160" fill="rgb(0,0,0)" data-ocr-confidence="96">Security Project</text>
  <text id="t2" x="422" y="1122" font-size="146" fill="rgb(0,0,0)" data-ocr-confidence="96">Спонсоры</text>
  <text id="t3" x="419" y="1401" font-size="50" fill="rgb(0,0,0)" data-ocr-confidence="96">Мы благодарны нашим спонсорам проекта за финансовый вклад, помогающий достигать целей</text>
  <text id="t4" x="422" y="1476" font-size="50" fill="rgb(0,0,0)" data-ocr-confidence="95">проекта и покрывать операционные расходы и расходы на продвижение, дополняя ресурсы, предоставляемые</text>
  <text id="t5" x="422" y="1548" font-size="50" fill="rgb(0,0,0)" data-ocr-confidence="94">фондом OWASP.org. OWASP GenAI Security Project продолжает придерживаться независимого от поставщиков и</text>
  <text id="t6" x="422" y="1617" font-size="46" fill="rgb(0,0,0)" data-ocr-confidence="95">беспристрастного подхода. Спонсоры не получают особых прав в управлении проектом в рамках своей</text>
  <text id="t7" x="422" y="1690" font-size="42" fill="rgb(0,0,0)" data-ocr-confidence="95">поддержки.</text>
  <text id="t8" x="419" y="1837" font-size="47" fill="rgb(0,0,0)" data-ocr-confidence="95">Спонсоры получают признание своего вклада в наших материалах и на веб-ресурсах. Все</text>
  <text id="t9" x="422" y="1912" font-size="50" fill="rgb(0,0,0)" data-ocr-confidence="95">материалы, создаваемые проектом, разрабатываются сообществом и публикуются под открытой лицензией</text>
  <text id="t10" x="422" y="1972" font-size="37" fill="rgb(0,0,0)" data-ocr-confidence="96">Creative Commons.</text>
  <text id="t11" x="1172" y="1981" font-size="46" fill="rgb(0,0,0)" data-ocr-confidence="96">Подробнее о том, как стать спонсором, — в разделе о спонсорстве</text>
  <text id="t12" x="419" y="2134" font-size="49" fill="rgb(0,0,0)" data-ocr-confidence="95">на нашем сайте, где можно узнать больше о поддержке проекта через спонсорство.</text>
  <text id="t13" x="422" y="2307" font-size="78" fill="rgb(0,0,0)" data-ocr-confidence="96">Спонсоры проекта:</text>
  <text id="t14" x="458" y="2476" font-size="16" fill="rgb(136,144,152)" data-ocr-confidence="91">SECURI</text>
